name: MindCare AI Backend CI

on:
  push:
    branches: [ main, master, mindcare-v2 ]
  pull_request:
    branches: [ main, master, mindcare-v2 ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx ruff black isort mypy bandit safety pip-audit psutil prometheus-client opentelemetry-api opentelemetry-sdk opentelemetry-instrumentation-fastapi

      - name: Code Formatting Check (Black)
        run: black --check backend/app

      - name: Import Sorting Check (isort)
        run: isort --check-only backend/app

      - name: Lint Audits (Ruff)
        run: ruff check backend/app

      - name: Type Inspection (mypy)
        run: mypy --ignore-missing-imports backend/app

      - name: Security Scanning (Bandit)
        run: bandit -r backend/app -ll

      - name: Dependency Vulnerability Scanning (Safety)
        run: safety check || echo "Safety warnings found, continuing..."

      - name: Dependency Auditing (pip-audit)
        run: pip-audit || echo "pip-audit warnings found, continuing..."

      - name: Code Compilation Check
        run: python -m compileall backend/app

      - name: Run Pytest Suite & Coverage
        run: |
          cd backend
          python -m pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
