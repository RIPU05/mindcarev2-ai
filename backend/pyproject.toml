[project]
name = "mindcare-ai-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for MindCare AI v2."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "email-validator>=2.2.0",
  "python-dotenv>=1.0.1",
  "SQLAlchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "httpx>=0.27.0",
  "PyJWT[crypto]>=2.9.0",
  "aiosqlite>=0.20.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501", "B009", "B010"]



[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.py$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.models.*"
ignore_errors = true
