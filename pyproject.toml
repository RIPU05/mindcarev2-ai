[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = 'backend/alembic'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
extend_skip = ["backend/alembic"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backend/alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501", "B009", "B010"]

[tool.ruff.lint.isort]
known-first-party = ["app"]


